<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire JWT Generator</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #0f3460;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
            font-size: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #a0a0b0;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 2px solid #1a1a2e;
            border-radius: 10px;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #e94560;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #c73652; }
        button:disabled { background: #555; cursor: not-allowed; }
        .token-box { margin-top: 25px; display: none; }
        .token-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .token-label span { font-weight: 600; color: #a0a0b0; font-size: 14px; }
        .copy-btn {
            background: #0f3460;
            border: 2px solid #e94560;
            color: #e94560;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            width: auto;
            transition: all 0.3s;
        }
        .copy-btn:hover { background: #e94560; color: white; }
        textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 2px solid #1a1a2e;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
            min-height: 100px;
            word-break: break-all;
        }
        .error-msg { color: #ff6b6b; text-align: center; margin-top: 15px; display: none; font-size: 14px; }
        .loading { display: none; text-align: center; margin-top: 15px; color: #a0a0b0; }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #e94560;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔥 Free Fire JWT Generator</h1>

        <label for="uid">Free Fire UID</label>
        <input type="text" id="uid" placeholder="যেমন: 8326995321" autocomplete="off">

        <label for="password">Guest Account Password</label>
        <input type="text" id="password" placeholder="পাসওয়ার্ড দিন" autocomplete="off">

        <button id="generateBtn" onclick="generateToken()">Generate</button>

        <div id="loading" class="loading">
            <span class="spinner"></span> JWT তৈরি হচ্ছে...
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div id="tokenBox" class="token-box">
            <div class="token-label">
                <span>JWT Token</span>
                <button class="copy-btn" onclick="copyToken()">📋 Copy</button>
            </div>
            <textarea id="tokenOutput" readonly></textarea>
        </div>
    </div>

    <script>
        async function generateToken() {
            const uid = document.getElementById('uid').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            const tokenBox = document.getElementById('tokenBox');
            const tokenOutput = document.getElementById('tokenOutput');

            errorMsg.style.display = 'none';
            tokenBox.style.display = 'none';
            tokenOutput.value = '';

            if (!uid || !password) {
                errorMsg.textContent = 'UID এবং পাসওয়ার্ড উভয়ই দিন।';
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, password })
                });

                const data = await res.json();

                if (data.success && data.token) {
                    tokenOutput.value = data.token;
                    tokenBox.style.display = 'block';
                } else {
                    errorMsg.textContent = data.error || 'JWT তৈরি করা যায়নি। আবার চেষ্টা করুন।';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'নেটওয়ার্ক ত্রুটি: ' + err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function copyToken() {
            const tokenOutput = document.getElementById('tokenOutput');
            tokenOutput.select();
            tokenOutput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(tokenOutput.value).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
            }).catch(() => {
                alert('কপি করতে ব্যর্থ হয়েছে। ম্যানুয়ালি সিলেক্ট করে কপি করুন।');
            });
        }
    </script>
</body>
</html>
